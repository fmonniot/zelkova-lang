# `package_acme_lib`, with a test module that fails to check. It is tested with
# `dep_acme_check_failing_test`, which depends on it, so the build is `src/`, then
# `acme-check`, then `tests/` — and the type error is in `tests/`.
name = "acme-lib"
version = "0.1.0"
private-modules = ["Internal"]

[dependencies]

[test-dependencies.acme-check]
path = "../dep_acme_check_failing_test"
