# The program `tests/js/RunChecks.mjs` runs with `zelkova run`: `main` runs an effectful
# facade whose companion writes to standard output. `cargo test` never runs it;
# `node --test 'tests/js/**/*.mjs'` does.
name = "package-run-says"
version = "0.1.0"
main = "App"
private-modules = []

[dependencies.zelkova-core]
path = "../../../std/core"

[test-dependencies]
