# `acme-basics` (`dep_rival_basics`) declares its own module `Basics`, which is
# reserved for `zelkova-core` whether or not a dependent wraps it — so resolving this
# build fails on `acme-basics` itself, before `App.zel` below is ever read.
name = "package-wrapped-rival-basics"
version = "0.1.0"
private-modules = []

[dependencies.zelkova-core]
path = "../dep_core"

[dependencies.acme-basics]
path = "../dep_rival_basics"

[test-dependencies]
