# The program `tests/js/RunChecks.mjs` runs with `zelkova run` to see what an abort does:
# `App` evaluates `answer` as it loads, and `answer`'s companion throws. `cargo test` never
# runs it; `node --test 'tests/js/**/*.mjs'` does.
name = "package-run-aborts"
version = "0.1.0"
main = "App"
private-modules = []

[dependencies.zelkova-core]
path = "../../../std/core"

[test-dependencies]
