on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

name: Continuous integration

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    # `cargo test` executes only Rust, so this is the one job that runs the JavaScript the
    # compiler emits and the companions `std/core` ships. It gates like every other job: what
    # it checks is runtime behaviour, which nothing else here would catch.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Pinned rather than taken from the runner image, whose preinstalled Node moves under
      # us. The floor is 21: `node --test` expands a quoted glob itself only from there on.
      # 24 is the current LTS.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Zelkova tests
        run: cargo run -- test std/core
      # Runs even when the step above failed, so one red step does not hide the other.
      - name: Companion checks
        if: ${{ !cancelled() }}
        run: |
          # `node --test` passes on a glob that matches no file. This lists what it will run,
          # and `grep .` fails the step when that list is empty.
          find std/core/tests -name '*.mjs' | grep .
          node --test 'std/core/tests/**/*.mjs'
      # The behavioural half of what the compiler emits: each file compiles its own fixture
      # under tests/fixtures/ with this checkout's compiler, then loads the output.
      - name: Compiler checks
        if: ${{ !cancelled() }}
        run: |
          find tests/js -name '*.mjs' | grep .
          node --test 'tests/js/**/*.mjs'

  site:
    name: Build the site
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: "-D warnings -W unreachable-pub"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p spec-site -- --out site
      - run: test -f site/index.html && test "$(ls site/spec/*.html | wc -l)" -eq 17

  fmt:
    name: Check formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions-rs-plus/clippy-check@v2.1.1
        with:
          args: --workspace --all-features

  rustdoc:
    name: Rustdoc
    runs-on: ubuntu-latest
    # The same flags `rustdoc.yml` builds the published docs with, so a change that would break
    # that deploy on `main` fails here first. Keep the two `env` blocks in step.
    env:
      RUSTFLAGS: "-D warnings -W unreachable-pub"
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc -p zelkova-lang --no-deps
