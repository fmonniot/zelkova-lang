[workspace]
members = ["crates/zelkova-syntax", "tools/spec-doc", "tools/spec-site"]

[workspace.package]
version = "0.3.0"
authors = ["François Monniot <francoismonniot@gmail.com>"]

[package]
name = "zelkova-lang"
version = "0.3.0"
authors = ["François Monniot <francoismonniot@gmail.com>"]
edition = "2018"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "zelkova"
path = "src/main.rs"

[dependencies]
log = "0.4"
codespan-reporting = "0.13"
env_logger = "0.11"
walkdir = "2.5"
petgraph = "0.8"
toml = "1.1.6"
serde = { version = "1.0.229", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
zelkova-syntax = { path = "crates/zelkova-syntax" }

[dev-dependencies]
indoc = "2.0"
spec-doc = { path = "tools/spec-doc" }
